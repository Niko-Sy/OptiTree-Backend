server:
  port: 8080
  mode: debug  # debug | release
  read_timeout: 30s
  write_timeout: 0s # SSE 长连接建议禁用写超时

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: optitree
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  max_retries: 3
  pool_size: 20
  min_idle_conns: 10

cache:
  enabled: true
  project_detail_enabled: true
  project_list_enabled: true
  version_list_enabled: true
  fault_tree_graph_enabled: true
  knowledge_graph_enabled: true
  project_detail_ttl: 30m
  project_list_ttl: 2h
  project_list_index_ttl: 130m
  version_list_ttl: 30m
  version_list_index_ttl: 40m
  fault_tree_graph_ttl: 30m
  knowledge_graph_ttl: 30m

jwt:
  secret: "change-this-to-a-very-long-random-secret-key-in-production"
  access_expire: 2h
  refresh_expire: 168h      # 7 days
  refresh_expire_long: 720h # 30 days (remember me)

ai_task:
  stream: "stream:ai:tasks"
  stream_max_len: 10000
  callback_header: "X-Internal-Token"
  callback_token: "change-me"
  producer_stream: "stream:ai:tasks:producer"
  producer_group: "ai-ft-producer"
  producer_read_count: 10
  producer_block_ms: 3000
  dispatcher_workers: 5
  producer_delayed_zset: "zset:ai:tasks:producer:delayed"
  producer_retry_delay_ms: 2000
  project_lock_ttl: 20m
  callback_dedupe_ttl: 24h
  snapshot_ttl: 24h

agent:
  enabled: false
  max_rounds: 10
  max_tool_calls: 30
  max_nodes_per_session: 50
  confirm_timeout: 300s
  preview_timeout: 600s
  session_ttl: 30m
  tool_call_rate_limit: 5
  enable_fallback_parser: true
  agent_model: ""
  prompt_version: "v2"
  include_hybrid_tools: false
  max_tool_summary_chars: 1200
  full_context_node_threshold: 120

log:
  enabled: true
  dir: "./logs"   # daily log files: logs/app-YYYY-MM-DD.log

storage:
  local_path: "./storage"
  base_url: "http://localhost:8080/static"
  max_file_size: 52428800   # 50MB
  allowed_image_types:
    - "image/jpeg"
    - "image/png"
    - "image/webp"
    - "image/gif"
  allowed_doc_types:
    - "application/pdf"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.ms-excel"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "text/plain"

document:
  conversion_workers: 3
  conversion_poll_interval: 2s

rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

ai:
  timeout: 120s
  default_provider: "qwen"

  # null(省略) = 使用 provider 默认；0 = 禁用字段；>0 = 显式下发
  max_completion_tokens: 0
  model_max_completion_tokens: {}

  # 前端可见模型列表（GetModels 直接读取）。
  models:
    - value: "qwen3.5-flash"
      label: "Qwen 3.5 Flash (Recommended)"
      recommended: true
    - value: "mimo:mimo-thinking"
      label: "MiMo Thinking"
      provider: "mimo"

  providers:
    qwen:
      endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""
      default_model: "qwen3.5-flash"
      chat_model: "qwen3.5-flash"
      model_prefixes: ["qwen"]
      max_completion_tokens: 0
      model_max_completion_tokens: {}

    mimo:
      endpoint: "https://api.minimax.chat/v1"
      api_key: ""
      default_model: "mimo-thinking"
      chat_model: "mimo-thinking"
      model_prefixes: ["mimo", "minimax"]
      max_completion_tokens: 8192
      model_max_completion_tokens: {}
